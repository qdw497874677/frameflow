# 前后端契约（唯一真相）
#
# 规则：
#  - 前端不得绕过本契约访问磁盘；后端严格实现本契约。
#  - 契约先行：改这里 → 同步 web/src/api/contract.ts → 改后端实现。
#  - 单用户、家用部署（Tailscale 内网）。所有路径均为**服务端可见的真实磁盘路径**。
openapi: 3.1.0
info:
  title: art-workspace API
  version: 0.1.0
  description: 照片整理 web 应用：目录浏览、RAW+JPEG 配对、星级/待删标记、回收站；任务与外部批注通道为预留。
servers:
  - url: /api/v1
    description: 前端经同源 /api/v1（Vite dev 代理或生产同域反向代理）

paths:
  /health:
    get:
      summary: 健康检查
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }

  /capabilities:
    get:
      summary: 能力自描述（有哪些任务 kind / 通道 / 执行者，各自要什么参数、会碰什么）
      description: |
        前端与 AI 客户端都靠它发现能力（见 docs/core-model.md §12）。
        新增能力 = 后端新增一个模块文件，前端零改动。
      x-implemented: true
      responses:
        "200":
          description: 注册表投影
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        label: { type: string }
                        params: { type: object, additionalProperties: true }
                        sideEffect: { type: string, description: "readonly | mark | library | newLocation | originals" }
                        undoable: { type: boolean }
                  channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
                  executors: { type: array, items: { type: object, properties: { kind: { type: string }, model: { type: string }, local: { type: boolean } } } }

  /session:
    post:
      summary: 单用户登录（换取会话 cookie）
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { password: { type: string } }, required: [password] } } }
      responses:
        "204": { description: 已建立会话（Set-Cookie） }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: 注销
      responses:
        "204": { description: 已注销 }

  /roots:
    get:
      summary: 可浏览的根目录
      description: 用户在设置里配置的一个或多个根（本地盘、挂载点）。`online=false` 表示当前不可访问（例如移动硬盘没插）。
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, required: [roots], properties: { roots: { type: array, items: { $ref: "#/components/schemas/Root" } } } } } } }

  /folders:
    get:
      summary: 列出一个目录（下钻/上翻），并返回该目录可见照片数
      parameters:
        - { name: path, in: query, schema: { type: string }, description: 绝对路径；省略则返回已配置的根目录 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [path, folders, photoCount]
                properties:
                  path: { type: string }
                  parent: { type: string, nullable: true }
                  folders:
                    type: array
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        photoCount: { type: integer, description: 递归可见照片数（可为空表示未统计） }
                        hasSubfolders: { type: boolean }
                  photoCount: { type: integer, description: 本目录直接含有的照片对数 }
        "404": { $ref: "#/components/responses/Error" }

  /photos:
    get:
      summary: 列出目录内的照片（配对后的一等实体）
      parameters:
        - { name: dir, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
        - { name: sel, in: query, schema: { type: string }, description: "选择集（谓词）的紧凑字符串形式，如 `stars>=3,marked,kind:photo,by:ai`。语法与求值语义见 contracts/selection.md" }
        - { name: filter, in: query, deprecated: true, schema: { type: string, enum: [all, starred, trash, unmarked], default: all }, description: "已弃用：等价于 sel 的四个常用简写（starred ⇔ marked；unmarked ⇔ marked:false）" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Photo" } }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/Error" }

  /photos/{id}/thumb:
    get:
      summary: 分层预览缩略图（JPEG）
      description: 服务端按票 001 的分层管线提供：外部 JPEG → 内嵌 JPEG 提取 → LibRaw 兜底；结果进 512/2048 两档缓存。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, enum: [512, 2048], default: 512 } }
        - { name: t, in: query, schema: { type: string }, description: "自认证的链接 token：签发 API token 时随响应给出（`linkToken`），图像加载器带不上 header 时用它。绑定签发它的 API token，撤销即失效；范围只有缩略图（见 docs/core-model.md §11）" }
      responses:
        "200": { description: JPEG 字节, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error", description: 该文件无法生成预览 }

  /photos/{id}/file:
    get:
      summary: 原始文件（RAW 或 JPEG）下载/直出
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: variant, in: query, schema: { type: string, enum: [jpeg, raw, video, auto], default: auto } }
      responses:
        "200": { description: 原始字节, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }

  /marks:
    put:
      summary: 批量写入星级/待删
      description: |
        语义（前后端共同不变式）：
        - `stars > 0` 与 `del = true` 互斥；同时给出时以 `del` 为准（清星）。
        - 以 **pair 为单位**：一次请求内的 RAW/JPEG 视为同一实体，一起写入。
        - `stars` 通过共享 XMP 持久化（与 Lightroom / Capture One 互通）。
        - 每个**实际发生变化**的字段追加一条变更日志（见 `GET /marks/history`）；
          未变化的项不写日志。日志是追加型、不回改，XMP 只留最终状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MarkInput" } }
      responses:
        "200":
          description: 写入结果（逐项）
          content:
            application/json:
              schema: { type: object, required: [results], properties: { results: { type: array, items: { $ref: "#/components/schemas/MarkResult" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /trash:
    get:
      summary: 回收站内容
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/TrashEntry" } } } }
    post:
      summary: 移入回收站（逻辑删除，可恢复）
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/OpResult" } } } }
    delete:
      summary: 清空或部分真删回收站（**唯一真正删除磁盘文件的入口**，需显式确认）
      description: 必须带 `?confirm=true`；`ids` 为空数组表示清空整个回收站。
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: boolean, const: true } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/OpResult" } } } }

  /trash/restore:
    post:
      summary: 从回收站恢复
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/OpResult" } } } }

  /marks/history:
    get:
      summary: 标注变更日志（最新的在前）
      description: |
        谁、什么时候、把哪个字段从什么改成了什么。挑片是同步的，写日志不改变手感；
        它是把批注任务推给外部渠道（如飞书）、再把别人的批注并回来时的对账凭据。
        后端落 `marks.jsonl`（追加型，不重写历史）。
      parameters:
        - { name: photoId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MarkChange" } } } }

  /api-tokens:
    get:
      summary: 列出已签发的 API token（AI agent / CLI / MCP 用）
      x-implemented: true
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [tokens], properties: { tokens: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } }

    post:
      summary: 签发一个 API token（明文只在响应里出现一次）
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [label], properties: { label: { type: string }, scope: { type: string, default: full } } }
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema:
                type: object
                required: [id, label, token]
                properties:
                  id: { type: string }
                  label: { type: string }
                  token: { type: string }
                  linkToken:
                    type: string
                    description: 自认证链接 token：缩略图 URL 用 `?t=<linkToken>`（图像加载器带不上 header）；绑定这条 API token，撤销即失效
                  linkExpiresAt: { type: string, format: date-time }
                  thumbUrlTemplate:
                    type: string
                    description: 把 `{id}` / `{size}`（512 或 2048）填上的缩略图 URL 模板

    delete:
      summary: 撤销一个 API token
      x-implemented: true
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: 已撤销 }

  # ── 以下为**预留**端点：契约先定形状，后端实现见 docs/core-model.md ──────────

  /jobs:
    post:
      summary: （预留，未实现）创建一个任务：选择集 + 操作 + 参数
      description: 任务是最小可追踪单位（导出/删除/处理/推送批注）。先 `plan`，人看过再 `apply`。
      x-implemented: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreateRequest" }
      responses:
        "201": { description: 已创建（状态为 planned 或 queued）, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
    get:
      summary: （预留，未实现）任务列表
      x-implemented: false
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Job" } } } } } } }

  /jobs/{id}:
    get:
      summary: （预留，未实现）任务详情（含 manifest：每个单位做了什么）
      x-implemented: false
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /jobs/{id}/events:
    get:
      summary: （预留，未实现）任务进度事件流（SSE）
      description: |
        `text/event-stream`。支持 `Last-Event-ID` 重连补发（事件是追加日志，可重放）。
        单用户单进程：没有消息队列，事件日志代替事件总线。
      x-implemented: false
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: SSE 流, content: { text/event-stream: { schema: { type: string } } } }

  /jobs/{id}/cancel:
    post:
      summary: （预留，未实现）取消任务（已完成的部分回滚或保留，由 handler 的 undo 决定）
      x-implemented: false
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }

  /jobs/{id}/undo:
    post:
      summary: （预留，未实现）撤销任务（只有 handler 声明可以撤销时才可调用）
      x-implemented: false
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }

  /channels:
    get:
      summary: （预留，未实现）已接入的批注通道（应用内、飞书、其他客户端）
      x-implemented: false
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Channel" } } } } } } }

  /channels/{id}/inbound:
    post:
      summary: （预留，未实现）外部批注回流入口
      description: |
        外部渠道（飞书回调、链接 token 的页面）把批注结果送回这里。
        鉴权：任务签发的范围受限 token（只能写这一批的标注），不建账号体系。
        `by` 记 `link:<别名>`；冲突以 `at` 较晚者为准，平局以服务端接收顺序为准。
      x-implemented: false
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [items], properties: { token: { type: string }, items: { type: array, items: { $ref: "#/components/schemas/MarkInput" } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { results: { type: array, items: { $ref: "#/components/schemas/MarkResult" } } } } } } }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: artworks_session
      description: 浏览器会话（`POST /session` 换取）；前端默认用它
    bearer:
      type: http
      scheme: bearer
      description: 长期 API token —— AI agent / CLI / MCP 客户端用，等价于本人全权限（见 docs/core-model.md §11）
    linkToken:
      type: apiKey
      in: query
      name: t
      description: "自认证链接 token：签发 API token 时随响应给出（`linkToken`）；当前范围是只读缩略图，绑定签发它的 API token（撤销即失效）。范围受限的外部批注链接（只读一批 + 只写标注，记 by: link:<别名>）是后续形态，见 docs/core-model.md §11"
  responses:
    Error:
      description: 错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Health:
      type: object
      required: [ok, version, roots]
      properties:
        ok: { type: boolean }
        version: { type: string }
        roots: { type: array, items: { type: string }, description: 已配置的可浏览根目录 }
        authRequired:
          type: boolean
          description: 后端是否启用了密码（`password` 非空）；前端据此决定要不要显示登录页
        authenticated:
          type: boolean
          description: |
            本次请求是否带了有效凭据（session cookie / bearer / 链接 token）。
            与 `authRequired` 分开：只看前者的话，刚登录成功的人再探一次就会被踢回登录页。

    Photo:
      type: object
      description: 配对后的照片实体（RAW+JPEG 视为一个实体）
      required: [id, dir, displayName, ar, kind, stars, del]
      properties:
        id: { type: string, description: 稳定 id（服务端生成，通常是主文件路径的 hash） }
        dir: { type: string }
        displayName: { type: string }
        kind: { type: string, enum: [photo, video] }
        ar: { type: number, description: 宽高比（w/h），用于布局占位 }
        width: { type: integer }
        height: { type: integer }
        orientation: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7, 8] }
        capturedAt: { type: string, format: date-time, nullable: true }
        camera: { type: string, nullable: true }
        lens: { type: string, nullable: true }
        hasRaw: { type: boolean }
        hasJpeg: { type: boolean }
        rawPath: { type: string, nullable: true }
        jpegPath: { type: string, nullable: true }
        videoPath: { type: string, nullable: true, description: 视频文件（kind=video 时的单文件路径） }
        sizeBytes: { type: integer }
        mtime: { type: string, format: date-time }
        stars: { type: integer, minimum: 0, maximum: 5 }
        del: { type: boolean }
        preview: { type: string, enum: [external_jpeg, embedded_jpeg, video_poster, raw_decode, pending], description: 预览来源（排查用） }
        focusHint: { type: string, enum: [sharp, soft, miss], nullable: true, description: 可选的模糊/跑焦提示（未来功能，前端可忽略） }

    MarkInput:
      type: object
      required: [id]
      properties:
        id: { type: string }
        stars: { type: integer, minimum: 0, maximum: 5 }
        del: { type: boolean }
        at: { type: string, format: date-time, description: 客户端时刻；服务端以它为准写变更日志，缺省用服务端时间 }
        by: { type: string, description: "谁改的：me | link:<别名> | ai | job:<id>" , default: me }
        channel: { type: string, description: "从哪个渠道改的：inapp | feishu | …", default: inapp }

    MarkChange:
      type: object
      description: 标注变更事件（追加进日志，不重写历史）
      required: [photoId, field, by, channel, at]
      properties:
        photoId: { type: string }
        displayName: { type: string }
        field: { type: string, enum: [stars, del] }
        from: { description: "改前（stars 为整数，del 为布尔；未知为 null）", nullable: true }
        to: { description: 改后, nullable: true }
        by: { type: string }
        channel: { type: string }
        at: { type: string, format: date-time }
        jobId: { type: string, nullable: true, description: 由某个任务引起时填上 }

    ApiToken:
      type: object
      description: 长期 API token 的元信息（AI agent / CLI / MCP；明文只在签发响应里出现一次）
      required: [id, label, createdAt]
      properties:
        id: { type: string }
        label: { type: string, description: "给谁用的，如 `claude-code@笔记本`" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, nullable: true, format: date-time }
        scope: { type: string, description: "v1 只有 full；预留 marks / project:<name> 等受限范围" }

    MarkResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        stars: { type: integer }
        del: { type: boolean }
        error: { type: string, nullable: true }

    TrashEntry:
      type: object
      required: [photoId, displayName, dir, fromDir, trashedAt]
      properties:
        photoId: { type: string }
        displayName: { type: string }
        dir: { type: string, description: 现在在哪（产品回收站目录） }
        fromDir: { type: string, description: 原来在哪（还原回这里） }
        trashedAt: { type: string, format: date-time }
        kind: { type: string, enum: [photo, video] }
        ar: { type: number }
        stars: { type: integer }
        hasRaw: { type: boolean }
        hasJpeg: { type: boolean }
        sizeBytes: { type: integer }

    OpResult:
      type: object
      required: [ok, failed]
      properties:
        ok: { type: integer, description: 成功条数 }
        failed: { type: array, items: { type: object, properties: { id: { type: string }, error: { type: string } } } }

    Root:
      type: object
      required: [id, path, label]
      properties:
        id: { type: string }
        path: { type: string }
        label: { type: string }
        photoCount: { type: integer }
        online: { type: boolean, description: false = 当前不可访问（未挂载/未插） }

    Selection:
      type: object
      description: |
        选择集：可序列化的谓词（不是 id 清单）。任务是「选择集 + 操作 + 参数」。
        GET /photos 的 `sel` 查询参数是它的紧凑字符串形式，语义完全一致（见 contracts/selection.md）。
      properties:
        project: { type: string, description: 项目（映射的目录）；省略 = 当前目录 }
        where:
          type: object
          description: 谓词：字段之间 AND
          properties:
            kind: { type: string, enum: [photo, video] }
            stars:
              type: object
              properties:
                gte: { type: integer, minimum: 0, maximum: 5 }
                lte: { type: integer, minimum: 0, maximum: 5 }
                eq: { type: integer, minimum: 0, maximum: 5 }
            del: { type: boolean }
            marked: { type: boolean, description: 是否打过星（stars > 0） }
            folder: { type: string, description: 目录包含匹配，大小写不敏感 }
            camera: { type: string, description: 机身包含匹配，大小写不敏感 }
            taken:
              type: object
              properties:
                after: { type: string, format: date }
                before: { type: string, format: date }
        ids: { type: array, items: { type: string }, description: 手选清单；与 where 同时存在时取交集 }

    JobState:
      type: string
      enum: [planned, queued, running, done, failed, cancelled, interrupted]

    JobItem:
      type: object
      description: manifest 的一行——「这个单位被怎么处理了」
      required: [id, status]
      properties:
        id: { type: string, description: 照片 id 或组 id }
        displayName: { type: string }
        status: { type: string, enum: [planned, done, skipped, failed] }
        from: { type: string }
        to: { type: string }
        note: { type: string }

    Artifact:
      type: object
      required: [kind, path]
      properties:
        kind: { type: string, description: "file | dir | url | message" }
        path: { type: string }
        bytes: { type: integer }

    Job:
      type: object
      required: [id, kind, state, selection, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, description: "能力名：export | trash | process | annotate | …（一个 kind 一个 handler）" }
        state: { $ref: "#/components/schemas/JobState" }
        selection: { $ref: "#/components/schemas/Selection" }
        params: { type: object, additionalProperties: true }
        progress: { type: object, properties: { done: { type: integer }, total: { type: integer } } }
        items: { type: array, items: { $ref: "#/components/schemas/JobItem" } }
        artifacts: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
        error: { type: string, nullable: true }
        reversible: { type: boolean, description: handler 是否声明可撤销 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    JobCreateRequest:
      type: object
      required: [kind, selection]
      properties:
        kind: { type: string }
        selection: { $ref: "#/components/schemas/Selection" }
        params: { type: object, additionalProperties: true }
        mode: { type: string, enum: [plan, apply], default: plan, description: plan 只读预演；apply 真干 }

    Channel:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind: { type: string, description: "inapp | feishu | webhook | …" }
        label: { type: string }
        inbound: { type: boolean, description: 是否支持批注回流 }
        enabled: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 机器可读错误码 }
        message: { type: string }
        detail: { type: object, additionalProperties: true }
