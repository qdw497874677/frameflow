# 前后端契约（唯一真相）
#
# 规则：
#  - 前端不得绕过本契约访问磁盘；后端严格实现本契约。
#  - 契约先行：改这里 → 同步 web/src/api/contract.ts → 改后端实现。
#  - 单用户、家用部署（Tailscale 内网）。所有路径均为**服务端可见的真实磁盘路径**。
openapi: 3.1.0
info:
  title: art-workspace API
  version: 0.1.0
  description: 照片整理 web 应用：目录浏览、RAW+JPEG 配对、星级/待删标记、回收站；任务层（annotate 批注往返）+ 内置应用内通道。
servers:
  - url: /api/v1
    description: 前端经同源 /api/v1（Vite dev 代理或生产同域反向代理）

paths:
  /health:
    get:
      summary: 健康检查
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }

  /capabilities:
    get:
      summary: 能力自描述（有哪些任务 kind / 通道 / 执行者，各自要什么参数、会碰什么）
      description: |
        前端与 AI 客户端都靠它发现能力（见 docs/core-model.md §12）。
        新增能力 = 后端新增一个模块文件，前端零改动。
      x-implemented: true
      responses:
        "200":
          description: 注册表投影
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        label: { type: string }
                        params: { type: object, additionalProperties: true }
                        sideEffect: { type: string, description: "readonly | mark | library | newLocation | originals" }
                        undoable: { type: boolean }
                  channels: { type: array, items: { $ref: "#/components/schemas/Channel" } }
                  executors: { type: array, items: { type: object, properties: { kind: { type: string }, model: { type: string }, local: { type: boolean } } } }

  /session:
    post:
      summary: 单用户登录（换取会话 cookie）
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { password: { type: string } }, required: [password] } } }
      responses:
        "204": { description: 已建立会话（Set-Cookie） }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      summary: 注销
      responses:
        "204": { description: 已注销 }

  /roots:
    get:
      summary: 已配置的项目
      description: 用户在设置里配置的一个或多个项目：每个 = 映射进来的一个磁盘目录（本地盘、挂载点）。`online=false` 表示当前不可访问（例如移动硬盘没插）。
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, required: [roots], properties: { roots: { type: array, items: { $ref: "#/components/schemas/Root" } } } } } } }
    post:
      summary: 添加一个项目
      description: >
        运行时添加（设置页「添加项目」）。后端先探路径可达（网络挂载 3s 超时保护），
        通过后写回配置文件（重启后仍在）并立刻后台扫描 —— 侧边栏树马上能看到它的子目录。
        id 由 label 或目录名派生，重复时自动加 -2/-3 后缀。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: 磁盘绝对路径（本地目录或挂载点） }
                label: { type: string, description: 显示名；缺省用目录名 }
      responses:
        "201":
          description: 已添加
          content:
            application/json:
              schema: { type: object, required: [root], properties: { root: { $ref: "#/components/schemas/Root" } } }
        "400": { description: 路径为空 / 已存在同样的项目, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 路径不存在或 3 秒内无响应（挂死的挂载）, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /fs/browse:
    get:
      summary: 列磁盘目录（供「选择目录」下钻，只列目录不列文件）
      description: >
        本地应用：后端就在用户的机器上，所以能浏览真实文件系统。
        缺省从用户主目录开始；点子目录下钻、点 parent 上翻。指向目录的符号链接也算（如 ~/nfs → gvfs 挂载）。
        隐藏目录（点开头）不列，减少噪声。
      parameters:
        - { name: path, in: query, schema: { type: string }, description: 磁盘绝对路径；缺省为主目录 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [path, parent, dirs]
                properties:
                  path: { type: string, description: 当前目录（绝对路径） }
                  parent: { type: [string, "null"], description: 上一级；到根目录为 null }
                  dirs:
                    type: array
                    description: 子目录（含指向目录的符号链接），按名称排序
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
        "404": { description: 目录不存在或读不了, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /roots/{rootId}:
    patch:
      summary: 改项目的显示名
      description: 只改配置里的 label（侧边栏与设置页展示用）；id、路径、照片都不动。
      parameters:
        - { name: rootId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, description: 新显示名（非空） }
      responses:
        "200": { description: 已改名, content: { application/json: { schema: { type: object, required: [root], properties: { root: { $ref: "#/components/schemas/Root" } } } } } }
        "404": { description: 没有这个根, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      summary: 移除一个项目（只解除映射，绝不删盘上文件）
      description: >
        把这个项目从配置里移除：侧边栏不再显示，它的照片与标记从库里消失，但磁盘上的文件一个都不动。
        想再要回来就重新添加同名路径（标记日志还在，历史不丢）。
      parameters:
        - { name: rootId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已移除 }
        "404": { description: 没有这个根, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /folders:
    get:
      summary: 列出一个目录（下钻/上翻），并返回该目录可见照片数
      parameters:
        - { name: path, in: query, schema: { type: string }, description: 绝对路径；省略则返回已配置的项目 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [path, folders, photoCount]
                properties:
                  path: { type: string }
                  parent: { type: string, nullable: true }
                  folders:
                    type: array
                    items:
                      type: object
                      required: [name, path]
                      properties:
                        name: { type: string }
                        path: { type: string }
                        photoCount: { type: integer, description: 递归可见照片数（可为空表示未统计） }
                        hasSubfolders: { type: boolean }
                  photoCount: { type: integer, description: 本目录直接含有的照片对数 }
        "404": { $ref: "#/components/responses/Error" }

  /photos:
    get:
      summary: 列出目录内的照片（配对后的一等实体）
      parameters:
        - { name: dir, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
        - { name: sel, in: query, schema: { type: string }, description: "选择集（谓词）的紧凑字符串形式，如 `stars>=3,marked,kind:photo,by:ai`。语法与求值语义见 contracts/selection.md" }
        - { name: filter, in: query, deprecated: true, schema: { type: string, enum: [all, starred, trash, unmarked], default: all }, description: "已弃用：等价于 sel 的四个常用简写（starred ⇔ marked；unmarked ⇔ marked:false）" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Photo" } }
                  nextCursor: { type: string, nullable: true }
                  total: { type: integer }
        "404": { $ref: "#/components/responses/Error" }

  /photos/{id}/thumb:
    get:
      summary: 分层预览缩略图（JPEG）
      description: 服务端按票 001 的分层管线提供：外部 JPEG → 内嵌 JPEG 提取 → LibRaw 兜底；结果进 512/2048 两档缓存。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: size, in: query, schema: { type: integer, enum: [512, 2048], default: 512 } }
        - { name: t, in: query, schema: { type: string }, description: "自认证的链接 token：签发 API token 时随响应给出（`linkToken`），图像加载器带不上 header 时用它。绑定签发它的 API token，撤销即失效；范围只有缩略图（见 docs/core-model.md §11）" }
      responses:
        "200": { description: JPEG 字节, content: { image/jpeg: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error", description: 该文件无法生成预览 }

  /photos/{id}/file:
    get:
      summary: 原始文件（RAW 或 JPEG）下载/直出
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: variant, in: query, schema: { type: string, enum: [jpeg, raw, video, auto], default: auto } }
      responses:
        "200": { description: 原始字节, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/Error" }

  /marks:
    put:
      summary: 批量写入星级/待删
      description: |
        语义（前后端共同不变式）：
        - `stars > 0` 与 `del = true` 互斥；同时给出时以 `del` 为准（清星）。
        - 以 **pair 为单位**：一次请求内的 RAW/JPEG 视为同一实体，一起写入。
        - `stars` 通过共享 XMP 持久化（与 Lightroom / Capture One 互通）。
        - 每个**实际发生变化**的字段追加一条变更日志（见 `GET /marks/history`）；
          未变化的项不写日志。日志是追加型、不回改，XMP 只留最终状态。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MarkInput" } }
      responses:
        "200":
          description: 写入结果（逐项）
          content:
            application/json:
              schema: { type: object, required: [results], properties: { results: { type: array, items: { $ref: "#/components/schemas/MarkResult" } } } }
        "409": { $ref: "#/components/responses/Error" }

  /trash:
    get:
      summary: 回收站内容
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/TrashEntry" } } } }
    post:
      summary: 移入回收站（逻辑删除，可恢复）
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/OpResult" } } } }
    delete:
      summary: 清空或部分真删回收站（**唯一真正删除磁盘文件的入口**，需显式确认）
      description: 必须带 `?confirm=true`；`ids` 为空数组表示清空整个回收站。
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: boolean, const: true } }
      requestBody:
        content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/OpResult" } } } }

  /trash/restore:
    post:
      summary: 从回收站恢复
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } } } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/OpResult" } } } }

  /marks/history:
    get:
      summary: 标注变更日志（最新的在前）
      description: |
        谁、什么时候、把哪个字段从什么改成了什么。挑片是同步的，写日志不改变手感；
        它是把批注任务推给外部渠道（如飞书）、再把别人的批注并回来时的对账凭据。
        后端落 `marks.jsonl`（追加型，不重写历史）。
      parameters:
        - { name: photoId, in: query, schema: { type: string } }
        - { name: jobId, in: query, schema: { type: string }, description: 只看某个任务引起的变更（批注回流对账） }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/MarkChange" } } } }

  /api-tokens:
    get:
      summary: 列出已签发的 API token（AI agent / CLI / MCP 用）
      x-implemented: true
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: object, required: [tokens], properties: { tokens: { type: array, items: { $ref: "#/components/schemas/ApiToken" } } } }

    post:
      summary: 签发一个 API token（明文只在响应里出现一次）
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [label], properties: { label: { type: string }, scope: { type: string, default: full } } }
      responses:
        "201":
          description: 已签发
          content:
            application/json:
              schema:
                type: object
                required: [id, label, token]
                properties:
                  id: { type: string }
                  label: { type: string }
                  token: { type: string }
                  linkToken:
                    type: string
                    description: 自认证链接 token：缩略图 URL 用 `?t=<linkToken>`（图像加载器带不上 header）；绑定这条 API token，撤销即失效
                  linkExpiresAt: { type: string, format: date-time }
                  thumbUrlTemplate:
                    type: string
                    description: 把 `{id}` / `{size}`（512 或 2048）填上的缩略图 URL 模板

    delete:
      summary: 撤销一个 API token
      x-implemented: true
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: 已撤销 }

  # ── 任务层与通道：状态机在 server/src/core/jobs.ts，handler 在 server/src/jobs/ ──

  /jobs:
    post:
      summary: 创建一个任务：选择集 + 操作 + 参数
      description: |
        任务是最小可追踪单位（推送批注 / 导出 / 处理…）。先 `plan`，人看过再 `apply`。
        创建时服务端把 `selection` 谓词**展开成 `items` 快照** —— 派发出去的那一批必须是稳定的；
        谓词本身仍留在 `selection` 里作为「怎么选出来的」凭据（见 contracts/selection.md）。
        第一个 kind 是 `annotate`：`params: { channel, label }` —— `channel` 是投递通道（v1 只有 `inapp`），
        `label` 是批注人（回流记 `by: 'link:<label>'`）。

        `mode: 'plan'` **不落库、不签发任何东西**：返回的 `Job` 只是预览，`id` 固定为 `"plan"`（不是真任务，
        `GET /jobs/{id}` 查不到）；`mode: 'apply'` 才落库并把状态推到 `queued` → `running`。
        执行在后台：201 返回的那一刻 `artifacts` 可能还是空的（`annotate` 的批次链接要等 handler 跑完），
        所以要看进度/链接就轮询 `GET /jobs/{id}`（v1 用轮询，见 `/jobs/{id}/events`）。
        状态机：`planned → queued → running → done | failed | cancelled`；重启时 `queued`/`running` 收敛为
        `interrupted`（没有执行者了，可 `undo` 或收新回流时接着跑）；非法迁移 / 已收摊的任务再取消 → 409。
      x-implemented: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobCreateRequest" }
      responses:
        "201": { description: 已创建（状态为 planned 或 queued）, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
    get:
      summary: 任务列表
      x-implemented: true
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Job" } } } } } } }

  /jobs/{id}:
    get:
      summary: 任务详情（含 items 快照与进度）
      description: |
        `items` 是创建时定下的那一批（manifest：每个单位的状态/最终标注），
        事件流水在 `/jobs/{id}/events`，标注变更对账在 `GET /marks/history?jobId=`。
        批注页（`/j?t=`）用任务签发的范围 token 读**它自己那一个**任务的详情（刷新后能读回
        已经标过的 items）；列表、事件、取消、撤销都不在范围 token 的放行范围内。
      x-implemented: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "404": { $ref: "#/components/responses/Error" }

  /jobs/{id}/events:
    get:
      summary: 任务事件日志（增量轮询）
      description: |
        追加型事件日志，每条带**单调递增 `seq`**；`since` 之后的事件按序返回，`nextSince` 当游标。
        v1 用轮询（单用户单进程，任务页只看进度与「谁改了什么」）；
        将来要实时推送时可在同一形状上加 SSE —— `Last-Event-ID` = `seq`，日志本身可重放。
      x-implemented: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: since, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, nextSince]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JobEvent" } }
                  nextSince: { type: integer }

  /jobs/{id}/inbound:
    post:
      summary: 外部批注回流入口
      description: |
        批注人（拿着任务签发的范围 token，`annotate:<jobId>`）把结果送回**任务**；
        通道只负责出站投递，回流一律落在这里。
        `by` **不由请求体决定** —— 从 token 里的批注人推出 `by: 'link:<批注人>'`（避免伪造）；
        只能写这个任务 items 里的照片，写别的返回 404。
        幂等：每条可带 `clientRef`，重复提交同一条会跳过并返回首次结果（外部系统会整批重发）——
        **整批都是老 `clientRef` 的重放**在任务已经 `done`/`cancelled` 时也照旧回 200（重发问的是「记下没有」）；
        但在已收摊的任务里带**新的** `clientRef` → 409。
        冲突：后写覆盖 + 历史留痕（`GET /marks/history?jobId=` 与任务事件流都能对账）。
        任务 `running` 且所有 items 都有终态 → `done`（跳过/失败也算有交代）。
      x-implemented: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/InboundItem" } }
      responses:
        "200":
          description: 写入结果（逐项；重复的 clientRef 返回首次结果）
          content:
            application/json:
              schema: { type: object, required: [results], properties: { results: { type: array, items: { $ref: "#/components/schemas/MarkResult" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /jobs/{id}/cancel:
    post:
      summary: 取消任务（已完成的部分回滚或保留，由 handler 的 undo 决定）
      description: |
        取消只是把任务停在 `cancelled` 并**断掉它签发的范围 token**（批注链接当场失效）；
        已经写下的标注**不会被回滚** —— 要退回标注请显式调 `/jobs/{id}/undo`。
        已是 `done` / `failed` / `cancelled` 的任务不能再取消（409）。
      x-implemented: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }

  /jobs/{id}/undo:
    post:
      summary: 撤销任务（只有 handler 声明可以撤销时才可调用）
      description: |
        `handler.undoable` 为真才能撤（否则 409），同一个任务只能撤一次。
        `annotate` 的 undo = 按 `marks.jsonl` 里**本任务写下的最早 `from` 值**把标注回滚（记录为
        `channel: 'undo'`, `by: 'me'`），撤销后任务落在 `cancelled`（终态语义：不要再等它回流）。
      x-implemented: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }

  /channels:
    get:
      summary: 已配置的**出站**投递通道（应用内、飞书、webhook…）
      description: |
        通道只管「怎么把一批照片发出去」；批注回流一律走 `POST /jobs/{id}/inbound`。
        v1 只有内置的应用内通道（`inapp`）：它不发消息，只签发一条批次链接（URL 在任务的 artifacts 里）。
      x-implemented: true
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Channel" } } } } } } }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: artworks_session
      description: 浏览器会话（`POST /session` 换取）；前端默认用它
    bearer:
      type: http
      scheme: bearer
      description: 长期 API token —— AI agent / CLI / MCP 客户端用，等价于本人全权限（见 docs/core-model.md §11）
    linkToken:
      type: apiKey
      in: query
      name: t
      description: "自认证链接 token：签发 API token 时随响应给出（`linkToken`）；v1 范围是只读缩略图，绑定签发它的 API token（撤销即失效）。任务签发的**范围 token**（载荷 `annotate|<jobId>|<批注人>|<exp>|<tokenId>`，第 5 段绑签发它的 API token，`-` = 会话/免认证签发：只读该任务的选择集（`GET /jobs/{id}` 只放行 token 里那个 id）+ 缩略图、只能 POST `/jobs/{id}/inbound`、记 `by: 'link:<批注人>'`，撤销签发 token 即失效）共用这套签名原语，见 docs/core-model.md §11"
  responses:
    Error:
      description: 错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Health:
      type: object
      required: [ok, version, roots]
      properties:
        ok: { type: boolean }
        version: { type: string }
        roots: { type: array, items: { type: string }, description: 已配置的可浏览项目 }
        authRequired:
          type: boolean
          description: 后端是否启用了密码（`password` 非空）；前端据此决定要不要显示登录页
        authenticated:
          type: boolean
          description: |
            本次请求是否带了有效凭据（session cookie / bearer / 链接 token）。
            与 `authRequired` 分开：只看前者的话，刚登录成功的人再探一次就会被踢回登录页。

    Photo:
      type: object
      description: 配对后的照片实体（RAW+JPEG 视为一个实体）
      required: [id, dir, displayName, ar, kind, stars, del]
      properties:
        id: { type: string, description: 稳定 id（服务端生成，通常是主文件路径的 hash） }
        dir: { type: string }
        displayName: { type: string }
        kind: { type: string, enum: [photo, video] }
        ar: { type: number, description: 宽高比（w/h），用于布局占位 }
        width: { type: integer }
        height: { type: integer }
        orientation: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7, 8] }
        capturedAt: { type: string, format: date-time, nullable: true }
        camera: { type: string, nullable: true }
        lens: { type: string, nullable: true }
        hasRaw: { type: boolean }
        hasJpeg: { type: boolean }
        rawPath: { type: string, nullable: true }
        jpegPath: { type: string, nullable: true }
        videoPath: { type: string, nullable: true, description: 视频文件（kind=video 时的单文件路径） }
        sizeBytes: { type: integer }
        mtime: { type: string, format: date-time }
        stars: { type: integer, minimum: 0, maximum: 5 }
        del: { type: boolean }
        preview: { type: string, enum: [external_jpeg, embedded_jpeg, video_poster, raw_decode, pending], description: 预览来源（排查用） }
        focusHint: { type: string, enum: [sharp, soft, miss], nullable: true, description: 可选的模糊/跑焦提示（未来功能，前端可忽略） }

    MarkInput:
      type: object
      required: [id]
      properties:
        id: { type: string }
        stars: { type: integer, minimum: 0, maximum: 5 }
        del: { type: boolean }
        at: { type: string, format: date-time, description: 客户端时刻；服务端以它为准写变更日志，缺省用服务端时间 }
        by: { type: string, description: "谁改的：me | link:<批注人> | ai | job:<id>" , default: me }
        channel: { type: string, description: "从哪个渠道改的：inapp | feishu | …", default: inapp }

    MarkChange:
      type: object
      description: 标注变更事件（追加进日志，不重写历史）
      required: [photoId, field, by, channel, at]
      properties:
        photoId: { type: string }
        displayName: { type: string }
        field: { type: string, enum: [stars, del] }
        from: { description: "改前（stars 为整数，del 为布尔；未知为 null）", nullable: true }
        to: { description: 改后, nullable: true }
        by: { type: string }
        channel: { type: string }
        at: { type: string, format: date-time }
        jobId: { type: string, nullable: true, description: 由某个任务引起时填上 }

    ApiToken:
      type: object
      description: 长期 API token 的元信息（AI agent / CLI / MCP；明文只在签发响应里出现一次）
      required: [id, label, createdAt]
      properties:
        id: { type: string }
        label: { type: string, description: "给谁用的，如 `claude-code@笔记本`" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, nullable: true, format: date-time }
        scope: { type: string, description: "v1 只有 full；预留 marks / project:<name> 等受限范围" }

    MarkResult:
      type: object
      required: [id, ok]
      properties:
        id: { type: string }
        ok: { type: boolean }
        stars: { type: integer }
        del: { type: boolean }
        error: { type: string, nullable: true }

    TrashEntry:
      type: object
      required: [photoId, displayName, dir, fromDir, trashedAt]
      properties:
        photoId: { type: string }
        displayName: { type: string }
        dir: { type: string, description: 现在在哪（产品回收站目录） }
        fromDir: { type: string, description: 原来在哪（还原回这里） }
        trashedAt: { type: string, format: date-time }
        kind: { type: string, enum: [photo, video] }
        ar: { type: number }
        stars: { type: integer }
        hasRaw: { type: boolean }
        hasJpeg: { type: boolean }
        sizeBytes: { type: integer }

    OpResult:
      type: object
      required: [ok, failed]
      properties:
        ok: { type: integer, description: 成功条数 }
        failed: { type: array, items: { type: object, properties: { id: { type: string }, error: { type: string } } } }

    Root:
      type: object
      required: [id, path, label]
      properties:
        id: { type: string }
        path: { type: string, description: 虚拟路径（/<id> 开头），API 与前端路由用这个 }
        diskPath: { type: string, description: 这个根对应的磁盘绝对路径（挂载在哪、导的是哪个目录，侧边栏直接展示给用户看） }
        label: { type: string }
        photoCount: { type: integer }
        online: { type: boolean, description: false = 当前不可访问（未挂载/未插） }
        lastError:
          type: string
          nullable: true
          description: 上一次访问这个根失败的原因（扫描超时/挂载没挂上）；正常时为 null

    Selection:
      type: object
      description: |
        选择集：可序列化的谓词（不是 id 清单）。任务是「选择集 + 操作 + 参数」。
        GET /photos 的 `sel` 查询参数是它的紧凑字符串形式，语义完全一致（见 contracts/selection.md）。
        创建任务时服务端会把谓词**展开成 `items` 快照**（派发那一批必须稳定），谓词留在 `selection` 里当凭据。
      properties:
        project: { type: string, description: 项目（映射的目录）；省略 = 当前目录 }
        where:
          type: object
          description: 谓词：字段之间 AND
          properties:
            kind: { type: string, enum: [photo, video] }
            stars:
              type: object
              properties:
                gte: { type: integer, minimum: 0, maximum: 5 }
                lte: { type: integer, minimum: 0, maximum: 5 }
                eq: { type: integer, minimum: 0, maximum: 5 }
            del: { type: boolean }
            marked: { type: boolean, description: 是否打过星（stars > 0） }
            by: { type: string, description: "最后一次标注变更的来源前缀：me | link:<批注人> | ai:<模型>（从未标注过的不匹配）；服务端由 marks.jsonl 推导，前端 matchesSelection 暂不支持" }
            folder: { type: string, description: 目录包含匹配，大小写不敏感 }
            camera: { type: string, description: 机身包含匹配，大小写不敏感 }
            taken:
              type: object
              properties:
                after: { type: string, format: date }
                before: { type: string, format: date }
        ids: { type: array, items: { type: string }, description: 手选清单；与 where 同时存在时取交集 }

    JobState:
      type: string
      enum: [planned, queued, running, done, failed, cancelled, interrupted]

    JobItem:
      type: object
      description: manifest 的一行 ——「这个单位被怎么处理了」；对 annotate 就是「这张被标成了什么」
      required: [id, status]
      properties:
        id: { type: string, description: 照片 id 或组 id }
        displayName: { type: string }
        status: { type: string, enum: [planned, done, skipped, failed] }
        from: { type: string }
        to: { type: string }
        note: { type: string }
        stars: { type: integer, nullable: true, description: annotate：外部/执行者给的最终星数 }
        del: { type: boolean, nullable: true, description: annotate：是否标了待删 }
        clientRef: { type: string, nullable: true, description: 回流幂等键（外部系统重发整批时用来去重） }
        at: { type: string, format: date-time, nullable: true, description: 最后一次变更的时刻 }

    JobEvent:
      type: object
      description: 任务事件日志的一行（追加型，不回改；`seq` 单调递增，可当轮询游标）
      required: [seq, at, type]
      properties:
        seq: { type: integer }
        at: { type: string, format: date-time }
        type:
          type: string
          description: "created | dispatched | inbound | applied | skipped | conflict | failed | cancelled | undone | done | note"
        photoId: { type: string, nullable: true }
        from: { nullable: true, description: 改前（stars 整数 / del 布尔 / 状态字符串） }
        to: { nullable: true, description: 改后 }
        by: { type: string, nullable: true, description: "me | link:<批注人> | ai:<模型> | job:<id>" }
        channel: { type: string, nullable: true }
        clientRef: { type: string, nullable: true }
        note: { type: string, nullable: true }

    InboundItem:
      type: object
      description: 外部批注回流的一项；`by` 从 token 里的批注人推、不由客户端给
      required: [photoId]
      properties:
        photoId: { type: string }
        stars: { type: integer, minimum: 0, maximum: 5 }
        del: { type: boolean }
        at: { type: string, format: date-time, description: 批注人那边标下的时刻；缺省用服务端时间 }
        clientRef: { type: string, description: 幂等键：同一条重复提交会被跳过（返回首次结果） }

    Artifact:
      type: object
      required: [kind, path]
      properties:
        kind: { type: string, description: "file | dir | url | message" }
        path: { type: string }
        bytes: { type: integer }

    Job:
      type: object
      required: [id, kind, state, selection, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, description: "能力名：annotate | export | process | …（一个 kind 一个 handler）" }
        state: { $ref: "#/components/schemas/JobState" }
        selection: { $ref: "#/components/schemas/Selection" }
        params: { type: object, additionalProperties: true, description: "handler 参数；annotate：{ channel, label }" }
        channel: { type: string, nullable: true, description: 派发用的出站通道 id（没有派发则为 null） }
        dispatchedAt: { type: string, format: date-time, nullable: true }
        progress: { type: object, properties: { done: { type: integer }, total: { type: integer } } }
        items: { type: array, items: { $ref: "#/components/schemas/JobItem" }, description: 创建时展开的快照（那一批就是这些） }
        artifacts: { type: array, items: { $ref: "#/components/schemas/Artifact" }, description: "annotate：发出去的卡片/链接（kind: message | url）；export：目录/文件" }
        error: { type: string, nullable: true }
        reversible: { type: boolean, description: handler 是否声明可撤销 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    JobCreateRequest:
      type: object
      required: [kind, selection]
      properties:
        kind: { type: string }
        selection: { $ref: "#/components/schemas/Selection" }
        params: { type: object, additionalProperties: true, description: "annotate：{ channel: 'feishu', label: '老婆' }" }
        mode: { type: string, enum: [plan, apply], default: plan, description: plan 只读预演（展开 items 不落库）；apply 真干 }

    Channel:
      type: object
      required: [id, kind, label]
      description: 出站投递通道（应用内 / 飞书 / webhook…）；回流不走通道，走 `POST /jobs/{id}/inbound`
      properties:
        id: { type: string }
        kind: { type: string, description: "inapp | feishu | webhook | …" }
        label: { type: string }
        enabled: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: 机器可读错误码 }
        message: { type: string }
        detail: { type: object, additionalProperties: true }
