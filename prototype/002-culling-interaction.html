<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>002 · 挑选交互原型 v3 — A 看片流 / C 网格扫射</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
<script src="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/umd/photoswipe.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0c10; --panel: #14161c; --panel2: #1d2027; --panel3: #262a33; --line: #2b303b;
    --text: #eef0f5; --dim: #9aa1b2; --faint: #6b7280;
    --accent: #7ab0ff; --gold: #ffcc4d; --trash: #ff7085;
    --radius: 14px; --shadow: 0 8px 32px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #12141b 0%, var(--bg) 60%);
    color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--panel3); border-radius: 4px; }
  button { font-family: inherit; }

  /* ── 顶部状态条 ── */
  #statebar {
    position: fixed; inset: 0 0 auto 0; z-index: 30; display: flex; align-items: center; gap: 6px;
    height: 44px; padding: 0 12px;
    background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .stat {
    display: inline-flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums;
    padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
  }
  .stat b { font-size: 14px; color: var(--text); font-weight: 650; }
  .stat.s b { color: var(--gold); } .stat.t b { color: var(--trash); }
  #statebar .spacer { flex: 1; }
  .ghost {
    background: transparent; color: var(--dim); border: 1px solid transparent; border-radius: 9px;
    padding: 5px 12px; cursor: pointer; font-size: 13px; transition: all .15s;
  }
  .ghost:hover { color: var(--text); background: var(--panel2); }
  #log { color: var(--faint); font-size: 12px; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #app { position: fixed; inset: 44px 0 56px 0; }

  /* ── 底部模式切换（分段控件） ── */
  #switcher {
    position: fixed; inset: auto 0 0 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    height: 56px; padding: 0 12px calc(4px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .segmented { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
  .segmented button {
    display: inline-flex; align-items: center; gap: 7px; border: none; border-radius: 999px;
    background: transparent; color: var(--dim); padding: 8px 20px; cursor: pointer; font-size: 14px; font-weight: 550;
    transition: all .18s;
  }
  .segmented button.active { background: color-mix(in srgb, var(--accent) 18%, var(--panel3)); color: var(--text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  #switcher .hint { position: absolute; left: 14px; color: var(--faint); font-size: 11px; }
  #switcher .hint2 { position: absolute; right: 14px; color: var(--faint); font-size: 11px; }

  /* ══════════ 模式 A：看片流 ══════════ */
  .va-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 6px 0; }
  .va-cardwrap {
    position: relative; aspect-ratio: var(--arn, 1.5); width: auto;
    height: min(calc(100% - 116px), calc(min(92vw, 640px) / var(--arn, 1.5)));
  }
  .va-card {
    position: absolute; inset: 0; border-radius: var(--radius); overflow: hidden; background: var(--panel);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    touch-action: none; cursor: grab; will-change: transform;
  }
  .va-card:active { cursor: grabbing; }
  .va-card.zoomed { cursor: move; }
  .va-card img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 0 0; pointer-events: none; }
  .chips { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; pointer-events: none; }
  .chips .count { margin-left: auto; }
  .chip {
    font-size: 10.5px; font-weight: 600; letter-spacing: .4px; padding: 3px 8px; border-radius: 6px;
    background: rgba(8,9,12,.62); backdrop-filter: blur(6px); color: #dfe3ec; border: 1px solid rgba(255,255,255,.08);
  }
  .chip.raw { color: #9fd0ff; }
  .va-card .fbadge {
    position: absolute; bottom: 10px; right: 10px; pointer-events: none;
    font-size: 11px; padding: 3px 8px; border-radius: 6px;
    background: rgba(8,9,12,.62); backdrop-filter: blur(6px); color: var(--dim); border: 1px solid rgba(255,255,255,.08);
  }
  .va-card.zoomed .fbadge { display: none; }
  .va-card img.anim { transition: transform .25s ease-out; }
  .va-minimap {
    position: absolute; right: 10px; bottom: 10px; z-index: 5; width: 88px; border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.2); box-shadow: 0 2px 12px rgba(0,0,0,.55); display: none; cursor: zoom-out;
  }
  .va-card.zoomed .va-minimap { display: block; }
  .va-minimap img { width: 100%; display: block; opacity: .9; }
  .va-minimap .rect { position: absolute; border: 1.5px solid var(--accent); background: rgba(122,176,255,.16); box-sizing: border-box; pointer-events: none; }
  .va-minimap .z { position: absolute; left: 0; bottom: 0; font-size: 9px; font-variant-numeric: tabular-nums; background: rgba(8,9,12,.72); color: #cfd4de; padding: 1px 5px; border-radius: 0 6px 0 0; }
  .va-card .stamp {
    position: absolute; top: 16%; padding: 8px 22px; border-radius: 12px; font-size: 28px; font-weight: 800;
    letter-spacing: 2px; opacity: 0; pointer-events: none; backdrop-filter: blur(4px);
  }
  .stamp.like { left: 22px; color: var(--gold); border: 3px solid var(--gold); background: rgba(255,204,77,.08); transform: rotate(-9deg); }
  .stamp.nope { right: 22px; color: var(--trash); border: 3px solid var(--trash); background: rgba(255,112,133,.08); transform: rotate(9deg); }

  .va-stars { display: flex; gap: 5px; align-items: center; }
  .va-stars button {
    background: transparent; border: 1px solid transparent; color: #4a5060;
    border-radius: 9px; padding: 5px; cursor: pointer; transition: all .12s; display: flex;
  }
  .va-stars button svg { width: 17px; height: 17px; display: block; fill: currentColor; }
  .va-stars button:hover { transform: translateY(-1px); }
  .va-stars button.on { color: var(--gold); filter: drop-shadow(0 0 6px rgba(255,204,77,.4)); }
  .va-del {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 550; padding: 6px 12px; border-radius: 9px; cursor: pointer; transition: all .12s;
    background: transparent; border: 1px solid var(--line); color: var(--dim);
  }
  .va-del svg { width: 13px; height: 13px; fill: currentColor; }
  .va-del.on { color: var(--trash); border-color: color-mix(in srgb, var(--trash) 55%, transparent); background: color-mix(in srgb, var(--trash) 10%, transparent); }
  .va-meta { display: none; }
  .va-hint { display: none; color: var(--faint); font-size: 10.5px; }
  @media (min-width: 561px) { .va-hint { display: block; } }

  /* ══════════ 模式 C：网格（瀑布流） ══════════ */
  .vc-wrap { position: absolute; inset: 0; overflow-y: auto; padding: 14px 14px 20px; }
  .vc-grid { columns: 170px; column-gap: 10px; }
  .vc-tile {
    position: relative; border-radius: 12px; overflow: hidden; background: var(--panel); margin-bottom: 10px;
    border: 2px solid transparent; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.35);
    transition: transform .15s, border-color .15s;
  }
  .vc-tile:hover { transform: translateY(-2px); }
  .vc-tile.starred { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
  .vc-tile.is-trash { border-color: color-mix(in srgb, var(--trash) 70%, transparent); }
  .vc-tile.is-trash img { filter: grayscale(1) brightness(.45); }
  .vc-tile img { width: 100%; height: auto; display: block; }
  .vc-tile .stars-mini { position: absolute; left: 8px; bottom: 6px; font-size: 13px; letter-spacing: 2px; color: var(--gold); text-shadow: 0 1px 4px #000; pointer-events: none; }
  .vc-tile .fbadge2 { position: absolute; right: 7px; bottom: 6px; font-size: 10px; color: var(--dim); background: rgba(8,9,12,.55); border-radius: 5px; padding: 1px 6px; pointer-events: none; backdrop-filter: blur(4px); }
  .vc-tile .del-mini {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: none;
    background: rgba(8,9,12,.62); backdrop-filter: blur(6px); color: #cfd4de; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,.1);
  }
  .vc-tile .del-mini.on { color: var(--trash); border-color: color-mix(in srgb, var(--trash) 60%, transparent); }

  /* ══════════ 看片台（PhotoSwipe 挂载的定制 chrome） ══════════ */
  .cull-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 12;
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: linear-gradient(rgba(6,7,10,.82), rgba(6,7,10,0)); backdrop-filter: blur(10px);
  }
  .cull-top .name { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cull-top .lb-stars { display: flex; gap: 4px; }
  .cull-top .lb-stars button {
    background: rgba(20,22,28,.7); border: 1px solid var(--line); color: #4a5060;
    border-radius: 9px; padding: 6px; cursor: pointer; display: flex;
  }
  .cull-top .lb-stars button svg { width: 15px; height: 15px; fill: currentColor; display: block; }
  .cull-top .lb-stars button.on { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 55%, transparent); }
  .cull-top .btn {
    background: rgba(20,22,28,.7); border: 1px solid var(--line); color: var(--text); border-radius: 9px;
    padding: 6px 13px; cursor: pointer; font-size: 13px; font-weight: 550;
  }
  .cull-top .btn.danger { color: var(--trash); display: inline-flex; align-items: center; gap: 6px; }
  .cull-top .btn svg { width: 14px; height: 14px; fill: currentColor; }
  @media (max-width: 560px) {
    #switcher .hint, #switcher .hint2, #log { display: none; }
    .stat { padding: 2px 7px; font-size: 10.5px; } .stat b { font-size: 12.5px; }
    .ghost { padding: 5px 9px; }
    .cull-top .name { display: none; }
    .segmented button { padding: 9px 18px; }
  }
  .cull-film {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
    display: flex; gap: 6px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    overflow-x: auto; background: linear-gradient(rgba(6,7,10,0), rgba(6,7,10,.9) 45%);
  }
  .lb-thumb {
    flex: 0 0 auto; width: 62px; border-radius: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,.14);
    cursor: pointer; position: relative; background: var(--panel); transition: border-color .15s, transform .15s;
  }
  .lb-thumb:hover { transform: translateY(-2px); }
  .lb-thumb.cur { border-color: var(--accent); }
  .lb-thumb.is-trash img { filter: grayscale(1) brightness(.45); }
  .lb-thumb img { width: 100%; height: auto; display: block; }
  .lb-thumb .mk { position: absolute; right: 3px; bottom: 2px; font-size: 11px; color: var(--gold); text-shadow: 0 1px 3px #000; }
  .pswp { --pswp-bg: #06070a; }
</style>
</head>
<body>

<div id="statebar">
  <span class="stat s">⭐ <b id="st-star">0</b></span>
  <span class="stat t">🗑 <b id="st-trash">0</b></span>
  <span class="stat">未标 <b id="st-none">60</b></span>
  <span class="spacer"></span>
  <span id="log">开始挑选吧</span>
  <button class="ghost" id="undo" title="撤销 Ctrl+Z">↩</button>
  <button class="ghost" id="reset">重置</button>
</div>

<div id="app"></div>

<div id="switcher">
  <span class="hint">Shift+←→ 切模式</span>
  <div class="segmented">
    <button data-mode="a">🃏 <span>一个个看</span></button>
    <button data-mode="c">▦ <span>批量扫</span></button>
  </div>
  <span class="hint2">RAW+JPEG 成对</span>
</div>

<!-- 看片台 chrome（由 PhotoSwipe 挂载） -->
<div id="lb-chrome">
  <div class="cull-top" id="cull-top">
    <span class="name" id="lb-name"></span>
    <div class="lb-stars" id="lb-stars"></div>
    <button class="btn danger" id="lb-del">🗑</button>
    <button class="btn" id="lb-close">关闭 ✕</button>
  </div>
  <div class="cull-film" id="lb-film"></div>
</div>

<script>
'use strict';
/* ══════════════ 假照片生成（假对焦 + 混合横竖比） ══════════════ */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const palettes = [
  ['#1a2b4a', '#3d5a80', '#98c1d9'], ['#2d1b2e', '#6b2737', '#e8a87c'],
  ['#0d2818', '#2d6a4f', '#b7e4c7'], ['#33272a', '#7f4f24', '#a68a64'],
  ['#0b2545', '#13315c', '#8da9c4'], ['#2f1b0e', '#a44a3f', '#f4c095'],
];
const CAMS = ['Sony A7M4 · 24-70', 'Fuji X-T5 · 35 1.4', 'Ricoh GR3', 'iPhone 15 Pro'];
const SVG_STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.4 5.8 21.1l1.6-7L2 9.3l7.1-.7z"/></svg>';
const SVG_TRASH = '<svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zM6 9h12l-1 12H7L6 9z"/></svg>';
const items = [];
(function genItems() {
  const rnd = mulberry(20260905);
  for (let i = 0; i < 60; i++) {
    items.push({
      id: i, seed: 1000 + i, pal: palettes[i % palettes.length], cam: CAMS[i % CAMS.length],
      ar: (r2 => r2 < .6 ? 1.5 : r2 < .9 ? 2 / 3 : 1)(rnd()),          // 横 3:2 / 竖 2:3 / 方 1:1
      focus: (r => r < .45 ? 'sharp' : r < .6 ? 'soft' : 'miss')(rnd()), // 全清晰/整体软/局部跑焦
      stars: 0, del: false,
    });
  }
})();

const urlCache = new Map();
function photoURL(it, w) {
  const key = it.id + ':' + w;
  if (urlCache.has(key)) return urlCache.get(key);
  const h = Math.round(w / it.ar);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  const rnd = mulberry(it.seed);
  const [sky, mid, lit] = it.pal;
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, sky); g.addColorStop(.62, mid); g.addColorStop(.63, lit); g.addColorStop(1, '#0a0a0f');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,240,200,.9)'; x.beginPath(); x.arc(w * (.3 + rnd() * .4), h * .2 + rnd() * .15, w * .018 + 4, 0, 7); x.fill();
  for (let L = 0; L < 3; L++) {
    x.fillStyle = `rgba(${20 + L * 14},${24 + L * 14},${34 + L * 16},${.9 - L * .18})`;
    x.beginPath(); x.moveTo(0, h * .63);
    let y = h * (.58 + rnd() * .06);
    for (let px = 0; px <= w; px += w / 14) { y += (rnd() - .5) * h * .09; y = Math.max(h * .4, Math.min(h * .66, y)); x.lineTo(px, y); }
    x.lineTo(w, h); x.lineTo(0, h); x.fill();
  }
  x.strokeStyle = `rgba(${180 + rnd() * 40},${170 + rnd() * 30},${120},.8)`;
  for (let b = 0; b < w * (h / 400) * 2.2; b++) {
    const gx = rnd() * w, gy = h * .68 + rnd() * h * .32, len = (4 + rnd() * 14) * (w / 800);
    x.lineWidth = .8 * (w / 800);
    x.beginPath(); x.moveTo(gx, gy); x.lineTo(gx + (rnd() - .5) * len * 2, gy - len); x.stroke();
  }
  x.strokeStyle = 'rgba(8,8,12,.92)';
  const tx = w * (.08 + rnd() * .84);
  for (let b = 0; b < 7; b++) {
    let bx = tx, by = h * .64, ang = -1.2 - rnd() * .5, len = h * .1 * (w / 800);
    x.lineWidth = 2 * (w / 800);
    x.beginPath(); x.moveTo(bx, by);
    for (let s = 0; s < 6; s++) { bx += Math.cos(ang) * len * 2; by += Math.sin(ang) * len * 2; x.lineTo(bx, by); ang += (rnd() - .5) * .8; }
    x.stroke();
  }
  x.globalAlpha = .05;
  for (let n = 0; n < w * h / 900; n++) { x.fillStyle = rnd() > .5 ? '#fff' : '#000'; x.fillRect(rnd() * w, rnd() * h, 1, 1); }
  x.globalAlpha = 1;
  const applyBlur = (cx, cy, r, px) => { x.save(); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.clip(); x.filter = `blur(${px}px)`; x.drawImage(c, 0, 0); x.restore(); x.filter = 'none'; };
  if (it.focus === 'soft') applyBlur(w / 2, h / 2, Math.max(w, h), 2.2 * (w / 800));
  if (it.focus === 'miss') { const r = .16 + rnd() * .14; applyBlur(w * (.25 + rnd() * .5), h * (.45 + rnd() * .3), Math.min(w, h) * r, 3.4 * (w / 800)); }
  const u = c.toDataURL('image/jpeg', .82);
  urlCache.set(key, u);
  return u;
}
function focusBadge(it) { return it.focus === 'sharp' ? '' : it.focus === 'soft' ? '📉 偏软' : '📉 疑跑焦'; }

/* ══════════════ 全局状态 + 动作 ══════════════ */
const app = document.getElementById('app'), logEl = document.getElementById('log'),
      stStar = document.getElementById('st-star'), stTrash = document.getElementById('st-trash'),
      stNone = document.getElementById('st-none'),
      undo = document.getElementById('undo'), reset = document.getElementById('reset');
const undoStack = [];
function counts() { return { s: items.filter(i => i.stars > 0).length, t: items.filter(i => i.del).length }; }
function refreshStats() { const c = counts(); stStar.textContent = c.s; stTrash.textContent = c.t; stNone.textContent = items.length - c.s - c.t; }
function flash(msg) { logEl.textContent = msg; }
function pushUndo(entry) { undoStack.push(entry); if (undoStack.length > 200) undoStack.shift(); }
function doUndo() {
  const u = undoStack.pop();
  if (!u) return flash('没有可撤销的操作');
  if (u.kind === 'stars') { u.it.stars = u.prev; flash(`撤销：#${u.it.id + 1} 星级 → ${u.prev || '无'}`); }
  else { u.it.del = u.prev; flash(`撤销：#${u.it.id + 1} 待删 → ${u.prev ? '是' : '否'}`); }
  refreshStats(); render(); syncPswpChrome();
}
function setStars(it, n, why) {
  pushUndo({ kind: 'stars', it, prev: it.stars });
  it.stars = n; if (n > 0 && it.del) { pushUndo({ kind: 'del', it, prev: true }); it.del = false; }
  flash(`${why}：#${it.id + 1} → ${'★'.repeat(n) || '清除'}`); refreshStats();
}
function toggleDel(it, why) {
  pushUndo({ kind: 'del', it, prev: it.del });
  it.del = !it.del;
  if (it.del && it.stars) { pushUndo({ kind: 'stars', it, prev: it.stars }); it.stars = 0; }
  flash(`${why}：#${it.id + 1} ${it.del ? '🗑 待删' : '恢复'}`); refreshStats();
}
undo.onclick = doUndo;
reset.onclick = () => { items.forEach(it => { it.stars = 0; it.del = false; }); undoStack.length = 0; aCur = 0; closePswp(); flash('已重置全部标记'); refreshStats(); render(); };

/* ══════════════ 模式切换 ══════════════ */
let mode = (location.hash.match(/mode=([ac])/i) || [, 'a'])[1].toLowerCase();
let aCur = 0;
const pills = [...document.querySelectorAll('.segmented button')];
pills.forEach(p => p.onclick = () => setMode(p.dataset.mode));
function setMode(m) {
  mode = m;
  pills.forEach(p => p.classList.toggle('active', p.dataset.mode === m));
  try { history.replaceState(null, '', '#mode=' + m); } catch (e) {}
  render();
}
function render() { app.querySelectorAll('.vc-wrap,.va-stage').forEach(n => n.remove()); if (mode === 'c') renderGrid(); else renderA(); }

/* ══════════════ 模式 A：看片流（右滑⭐+上抬加星 · 左滑🗑 · 双击/捏合放大） ══════════════ */
function renderA() {
  app.querySelectorAll('.va-stage').forEach(n => n.remove());
  const stage = document.createElement('div'); stage.className = 'va-stage';
  const wrap = document.createElement('div'); wrap.className = 'va-cardwrap';
  const hint = document.createElement('div'); hint.className = 'va-hint';
  hint.textContent = '右滑 ⭐（顺势下压加星）· 左滑 🗑 · 双击/捏合 放大看细节';
  const meta = document.createElement('div'); meta.className = 'va-meta';
  const row = document.createElement('div'); row.className = 'va-stars';
  app.appendChild(stage);
  draw();

  function draw() {
    stage.innerHTML = ''; wrap.innerHTML = ''; row.innerHTML = ''; meta.innerHTML = '';
    const it = items[aCur];
    if (aCur >= items.length) {
      const c = counts();
      wrap.style.height = '200px';
      wrap.innerHTML = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--dim)">
        <div style="font-size:22px">看完了 🎉</div>
        <div style="font-size:13px;color:var(--faint)">⭐ ${c.s} · 🗑 ${c.t} · 未标 ${items.length - c.s - c.t}</div></div>`;
      const btn = document.createElement('button'); btn.textContent = '↻ 从头再看';
      btn.className = 'va-del'; btn.onclick = () => { aCur = 0; draw(); };
      stage.append(wrap, btn);
      return;
    }
    wrap.style.removeProperty('height');
    wrap.style.setProperty('--arn', it.ar);
    const card = document.createElement('div'); card.className = 'va-card';
    const img = document.createElement('img'); img.src = photoURL(it, 1600); img.draggable = false;
    card.appendChild(img);
    const mm = document.createElement('div'); mm.className = 'va-minimap'; mm.title = '点按退出放大';
    mm.innerHTML = `<img src="${photoURL(it, 180)}"><div class="rect"></div><span class="z"></span>`;
    card.appendChild(mm);
    const mmRect = mm.querySelector('.rect'), mmZ = mm.querySelector('.z');
    mm.addEventListener('pointerdown', e => e.stopPropagation());
    mm.addEventListener('click', e => { e.stopPropagation(); animZoom(() => { aZoom = null; }); });
    card.insertAdjacentHTML('beforeend',
      `<div class="chips"><span class="chip raw">RAW+JPEG</span><span class="chip">${it.cam}</span><span class="chip count">${String(aCur + 1).padStart(2, '0')}/${items.length}</span></div>` +
      `<div class="fbadge">${focusBadge(it)}</div>` +
      `<div class="stamp like">LIKE</div><div class="stamp nope">NOPE</div>`);
    wrap.appendChild(card);
    const like = card.querySelector('.like'), nope = card.querySelector('.nope');
    meta.innerHTML = `<span>${String(aCur + 1).padStart(2, '0')} / ${items.length}</span><span>${it.cam}</span>`;
    stage.append(wrap, row, hint);

    for (let n = 1; n <= 5; n++) {
      const b = document.createElement('button'); b.innerHTML = SVG_STAR; b.classList.toggle('on', n <= it.stars);
      b.onclick = () => { setStars(it, it.stars === n ? 0 : n, '打星'); draw(); };
      row.appendChild(b);
    }
    const db = document.createElement('button'); db.className = 'va-del' + (it.del ? ' on' : ''); db.innerHTML = SVG_TRASH + `<span>${it.del ? '待删中' : '待删'}</span>`;
    db.onclick = () => { toggleDel(it, 'A 模式'); if (it.del) { aCur = Math.min(items.length, aCur + 1); setTimeout(draw, 120); } else draw(); };
    row.appendChild(db);

    /* 手势：滑动 / 上抬加星 / 缩放平移 */
    aZoom = null;
    let drag = null; const pointers = new Map(); let pinchStart = null;
    let pendingStars = 1;
    const liveRow = n => { [...row.querySelectorAll('button')].forEach((b, i) => { if (i < 5) b.classList.toggle('on', i < n); }); };
    const applyCard = (dx, rot) => { card.style.transform = `translateX(${dx}px) rotate(${rot}deg)`; };
    const clampZoom = z => {
      if (!z || z.scale <= 1.001) return null;
      const cw = card.clientWidth, ch = card.clientHeight;
      z.tx = Math.min(0, Math.max(cw * (1 - z.scale), z.tx));
      z.ty = Math.min(0, Math.max(ch * (1 - z.scale), z.ty));
      return z;
    };
    const animZoom = fn => { img.classList.add('anim'); fn(); setTimeout(() => img.classList.remove('anim'), 260); applyZoom(); };
    const applyZoom = () => {
      aZoom = clampZoom(aZoom);
      if (!aZoom) { img.style.transform = ''; card.classList.remove('zoomed'); return; }
      card.classList.add('zoomed'); applyCard(0, 0);
      img.style.transform = `translate(${aZoom.tx}px,${aZoom.ty}px) scale(${aZoom.scale})`;
      // 小地图：框出当前视口在全图的位置
      const cw = card.clientWidth, ch = card.clientHeight, s = aZoom.scale;
      mmRect.style.cssText = `left:${(-aZoom.tx / (cw * s)) * 100}%;top:${(-aZoom.ty / (ch * s)) * 100}%;width:${100 / s}%;height:${100 / s}%;`;
      mmZ.textContent = Math.round(s * 100) + '%';
    };
    const zoomAt = (factor, px, py) => {
      const z = aZoom || { scale: 1, tx: 0, ty: 0 };
      const ns = Math.max(1, Math.min(6, z.scale * factor));
      const k = ns / z.scale;
      aZoom = clampZoom({ scale: ns, tx: px - k * (px - z.tx), ty: py - k * (py - z.ty) });
      if (aZoom && aZoom.scale <= 1.001) aZoom = null;
      applyZoom();
    };
    card.addEventListener('pointerdown', e => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      card.setPointerCapture(e.pointerId);
      if (pointers.size === 1) drag = { x0: e.clientX, y0: e.clientY, moved: false };
      if (pointers.size === 2 && aZoom) {
        const [p1, p2] = [...pointers.values()];
        pinchStart = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), s: aZoom.scale };
      }
    });
    card.addEventListener('pointermove', e => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2 && aZoom && pinchStart) {
        const [p1, p2] = [...pointers.values()];
        const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
        const r = card.getBoundingClientRect();
        zoomAt(d / pinchStart.d * pinchStart.s / aZoom.scale, (p1.x + p2.x) / 2 - r.left, (p1.y + p2.y) / 2 - r.top);
        return;
      }
      if (!drag) return;
      const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
      if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
      if (aZoom) { aZoom.tx += e.clientX - (drag.px ?? drag.x0); aZoom.ty += e.clientY - (drag.py ?? drag.y0); drag.px = e.clientX; drag.py = e.clientY; applyZoom(); return; }
      applyCard(dx, dx * .08);
      if (dx > 40) {
        pendingStars = Math.max(1, Math.min(5, 1 + Math.round(dy / 95)));
        like.textContent = 'LIKE ' + '★'.repeat(pendingStars);
        liveRow(pendingStars);
        like.style.opacity = Math.min(1, dx / 120); nope.style.opacity = 0;
      } else if (dx < -40) { like.style.opacity = 0; nope.style.opacity = Math.min(1, -dx / 120); }
      else { like.style.opacity = nope.style.opacity = 0; }
    });
    const endPointer = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStart = null;
      if (!drag) return;
      const dx = e.clientX - drag.x0;
      const wasZoom = !!aZoom, moved = drag.moved;
      drag = null;
      if (wasZoom || !moved) { applyCard(0, 0); like.style.opacity = nope.style.opacity = 0; return; }
      const TH = Math.min(95, card.clientWidth * .22);
      if (dx > TH) swipe(1); else if (dx < -TH) swipe(-1);
      else { applyCard(0, 0); like.style.opacity = nope.style.opacity = 0; draw(); }
      like.textContent = 'LIKE';
    };
    card.addEventListener('pointerup', endPointer);
    card.addEventListener('pointercancel', endPointer);
    card.addEventListener('dblclick', e => {
      const r = card.getBoundingClientRect();
      if (aZoom) animZoom(() => { aZoom = null; });
      else animZoom(() => { aZoom = { scale: 2.5, tx: 0, ty: 0 }; zoomAt(1, e.clientX - r.left, e.clientY - r.top); });
    });
    card.addEventListener('wheel', e => {
      e.preventDefault();
      const r = card.getBoundingClientRect();
      zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    function swipe(dir) {
      const it2 = items[aCur]; const stars = pendingStars;
      card.style.transition = 'transform .22s ease-out, opacity .22s'; card.style.opacity = 0;
      card.style.transform = `translateX(${dir * 120}%) rotate(${dir * 14}deg)`;
      setTimeout(() => {
        if (dir > 0 && it2.stars === 0) setStars(it2, stars, `右滑喜欢${stars}星`);
        else if (dir < 0 && !it2.del) toggleDel(it2, '左滑待删');
        aCur = Math.min(items.length, aCur + 1); draw();
      }, 200);
    }
  }
}
let aZoom = null;

/* ══════════════ 模式 C：网格 + PhotoSwipe 看片台 ══════════════ */
function renderGrid() {
  app.querySelectorAll('.vc-wrap').forEach(n => n.remove());
  const wrap = document.createElement('div'); wrap.className = 'vc-wrap';
  const grid = document.createElement('div'); grid.className = 'vc-grid';
  items.forEach((it, idx) => {
    const tile = document.createElement('div');
    tile.className = 'vc-tile' + (it.del ? ' is-trash' : '') + (it.stars && !it.del ? ' starred' : '');
    tile.innerHTML = `
      <img src="${photoURL(it, 360)}" loading="lazy">
      <span class="stars-mini">${'★'.repeat(it.stars)}</span>
      ${focusBadge(it) ? `<span class="fbadge2">${focusBadge(it)}</span>` : ''}`;
    const del = document.createElement('button'); del.className = 'del-mini' + (it.del ? ' on' : ''); del.textContent = it.del ? '↩' : '✕';
    del.onclick = e => { e.stopPropagation(); toggleDel(it, '网格'); renderGrid(); };
    tile.appendChild(del);
    let lastTap = 0;
    tile.onclick = () => {
      const now = Date.now();
      if (now - lastTap < 320) { lastTap = 0; openPswp(idx); return; }
      lastTap = now;
      setTimeout(() => { if (lastTap && Date.now() - lastTap >= 300) { lastTap = 0; setStars(it, (it.stars + 1) % 6, '网格点按'); renderGrid(); } }, 310);
    };
    grid.appendChild(tile);
  });
  wrap.appendChild(grid); app.appendChild(wrap);
}

/* ── PhotoSwipe 看片台 ── */
let pswp = null;
const lbTop = document.getElementById('cull-top'), lbFilm = document.getElementById('lb-film'),
      lbName = document.getElementById('lb-name'), lbStars = document.getElementById('lb-stars'),
      lbDel = document.getElementById('lb-del'), lbClose = document.getElementById('lb-close'),
      lbChrome = document.getElementById('lb-chrome');
function dataSource() {
  return items.map(it => ({ src: '', width: 1600, height: Math.round(1600 / it.ar) }));
}
function openPswp(idx) {
  if (!window.PhotoSwipe) { alert('PhotoSwipe 加载失败（需要联网）'); return; }
  pswp = new PhotoSwipe({
    dataSource: dataSource(), index: idx,
    wheelToZoom: true, pinchToClose: false, closeOnVerticalDrag: false,
    bgOpacity: 1, showHideAnimationType: 'none', zoom: true,
  });
  pswp.on('uiRegister', () => {
    pswp.ui.registerElement({ name: 'cull-top', order: 9, isButton: false, onInit: el => { el.className = 'cull-top'; el.appendChild(lbTop); } });
    pswp.ui.registerElement({ name: 'cull-film', order: 10, isButton: false, onInit: el => { el.className = 'cull-film'; el.appendChild(lbFilm); } });
  });
  pswp.on('gettingData', (e) => { e.data.src = photoURL(items[e.index], 1600); }); // 懒生成大图，避免一次60张
  pswp.on('change', () => syncPswpChrome());
  pswp.on('destroy', () => { pswp = null; lbChrome.append(lbTop, lbFilm); renderGrid(); });
  pswp.init();
  syncPswpChrome();
}
function closePswp() { if (pswp) pswp.close(); }
lbClose.onclick = closePswp;
lbDel.onclick = () => {
  if (!pswp) return;
  const it = items[pswp.currIndex];
  toggleDel(it, '看片台');
  pswpAdvance(1, true);
};
function pswpAdvance(d, skipDel) {
  if (!pswp) return;
  let i = pswp.currIndex + d;
  while (skipDel && i >= 0 && i < items.length && items[i].del) i += d;
  if (i < 0 || i >= items.length) { closePswp(); return; }
  pswp.goto(i);
}
function syncPswpChrome() {
  if (!pswp) return;
  const idx = pswp.currIndex, it = items[idx];
  lbName.textContent = `#${idx + 1} / ${items.length} · ${it.cam} · RAW+JPEG ${focusBadge(it)}`;
  lbStars.innerHTML = '';
  for (let n = 1; n <= 5; n++) {
    const b = document.createElement('button'); b.innerHTML = SVG_STAR; b.className = n <= it.stars ? 'on' : '';
    b.onclick = () => { setStars(it, it.stars === n ? 0 : n, '看片台'); syncPswpChrome(); };
    lbStars.appendChild(b);
  }
  lbDel.innerHTML = SVG_TRASH + `<span>${it.del ? '取消待删' : '待删'}</span>`;
  lbFilm.innerHTML = '';
  items.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'lb-thumb' + (i === idx ? ' cur' : '') + (t.del ? ' is-trash' : '');
    el.innerHTML = `<img src="${photoURL(t, 160)}" loading="lazy"><span class="mk">${t.stars ? '★'.repeat(Math.min(t.stars, 3)) : t.del ? '✕' : ''}</span>`;
    el.onclick = () => pswp.goto(i);
    lbFilm.appendChild(el);
  });
  lbFilm.querySelector('.cur')?.scrollIntoView({ inline: 'center', block: 'nearest' });
}

/* ══════════════ 键盘 ══════════════ */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) { if (e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); } return; }
  if (pswp) {
    const it = items[pswp.currIndex];
    if (e.key >= '1' && e.key <= '5') { setStars(it, +e.key, '键盘'); syncPswpChrome(); }
    else if (e.key === '0') { setStars(it, 0, '键盘'); syncPswpChrome(); }
    else if (e.key.toLowerCase() === 'x') { toggleDel(it, '键盘'); pswpAdvance(1, true); }
    return; // ←→/ESC 由 PhotoSwipe 处理
  }
  if (e.shiftKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { setMode(mode === 'a' ? 'c' : 'a'); return; }
  if (mode === 'a') {
    const it = items[aCur];
    if (e.key === ' ') { e.preventDefault(); aCur = Math.min(items.length, aCur + 1); renderA(); }
    else if (e.key.toLowerCase() === 'f') { if (it) { setStars(it, Math.max(1, it.stars), '键盘喜欢'); aCur = Math.min(items.length, aCur + 1); renderA(); } }
    else if (e.key.toLowerCase() === 'x') { if (it) { toggleDel(it, '键盘'); aCur = Math.min(items.length, aCur + 1); renderA(); } }
    else if (e.key === 'ArrowRight') { aCur = Math.min(items.length, aCur + 1); renderA(); }
    else if (e.key === 'ArrowLeft') { aCur = Math.max(0, aCur - 1); renderA(); }
    else if (e.key >= '1' && e.key <= '5') { if (it) { setStars(it, +e.key, '键盘'); renderA(); } }
  }
});

refreshStats();
setMode(mode);
</script>
</body>
</html>
