# art-workspace 后端配置示例
#
# 用 `cp artworks.config.example.yaml artworks.config.yaml` 复制一份再改；
# 也可以放到别处，用 `--config=/path/to.yaml` 或环境变量 `ARTWORKS_CONFIG` 指定。
#
# 所有路径都是**服务端进程可见的真实磁盘路径**：
#   - 服务跑在 NAS 上（推荐）→ 写容器/主机上的本地路径，如 /vol1/photos
#   - 服务跑在别的机器上   → 写挂载点，如 /mnt/nas/摄影（NFS/SMB 都一样，代码不分叉）
# 网络共享上的照片目录**只读也能用**（标注会退到 dataDir/marks.jsonl），但那样 XMP 不会回写。

# 监听地址：默认只监听本机。
#   本机开发：127.0.0.1
#   家里 + Tailscale 访问：0.0.0.0（同时请务必设置 password）
host: 127.0.0.1
port: 8787

# 应用数据目录：索引、缩略图缓存、marks.jsonl、token —— **不要放在照片共享里**。
dataDir: ~/.local/share/artworks

# 单用户密码。留空 = 免认证（只在本机开发时这么用）。
password: ""

# 照片根目录（可以多个：本机目录、移动硬盘、NAS 挂载点……）
roots:
  - id: nas          # 稳定标识：改名后 URL / 选择集里的路径不变
    label: NAS 摄影
    path: /mnt/nas/qdw/摄影
  # - id: local
  #   label: 本机图片
  #   path: ~/Pictures

scan:
  # 下钻深度上限（防止误指到 / 上把整盘扫了）
  maxDepth: 8
  # 单个根扫多久没响应就当它挂死了（毫秒）。网络挂载（NFS/gvfs）失联时靠它止损。
  rootTimeoutMs: 20000
  # 索引超过这么多天没扫就自动补扫一次（启动时 + 长期运行的实例每 10 分钟检查）；0 = 关
  autoRescanAfterDays: 7
  # 额外忽略的目录名（小写比较）；下面是内置默认值，写在这里是覆盖而不是追加
  ignore:
    - .artworks
    - .trash
    - .git
    - node_modules
    - "@eaDir"
    - "#recycle"
    - "@Recycle"
    - $RECYCLE.BIN
    - System Volume Information
    - .thumbnails

cache:
  # 预览缓存（512/2048 缩略图）上限，字节；超了按最久未读淘汰到 90%。
  # 默认 8 GiB；0 = 不限；也可用环境变量 ARTWORKS_CACHE_MAX_BYTES 覆盖。
  maxBytes: 8589934592

logLevel: info

# 实时入库：相机 FTP 直传 / 往收件目录拷文件 → 几秒后出现在库里（前端「新到 N 张」）
# ingest:
#   rootId: local              # 落到哪个项目
#   subdir: inbox/{date}       # 收件目录（{date} = 当天 YYYY-MM-DD）
#   stableMs: 2000             # 文件多久没变化才算写完（目录监听用；FTP 传完即算）
#   pairWindowMs: 3000         # RAW+JPEG 配对等待
#   watch: true                # 监听收件目录（SMB/rsync/拷贝进来的也入库）
#   ftp:
#     host: 0.0.0.0            # 只想走 Tailscale 就写本机 100.x 地址
#     port: 2121
#     pasvMin: 30000           # 被动端口范围（防火墙放行）
#     pasvMax: 30009
#     pasvUrl: 100.101.102.103 # PASV 回给相机的地址（相机能连到的那个 IP）
#     user: camera
#     passwordFile: ~/.config/frameflow/ftp-password   # 第一行是密码，≥8 位
#     tls:                     # 索尼相机只支持 FTPES（显式 TLS）；不配则只能明文（仅限可信局域网）
#       cert: ~/.config/frameflow/ftp-cert.pem
#       key: ~/.config/frameflow/ftp-key.pem
#     requireTls: true         # 配了 tls 默认强制加密
